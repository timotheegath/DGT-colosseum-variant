# OpenRouter smoke config (passthrough).
# This config uses the `fireworks` provider slot with `base_url: https://openrouter.ai/api/v1`.
# Required env vars: OPENROUTER_API_KEY (and FIREWORKS_API_KEY set to the same value).
# See README.md → "OpenRouter (passthrough)".
# Model name is the OpenRouter model id, e.g. `openai/gpt-4o-mini`.

# Optional `judge_llm:` block (currently unused by the persuasion runners — documented
# for forward compatibility with the LLM judges). Routes judges through OpenRouter via
# the `fireworks` provider slot.
judge_llm:
  provider: fireworks
  fireworks:
    model: openai/gpt-4o-mini   # or any cheap OpenRouter model id
    base_url: https://openrouter.ai/api/v1
    # api_key intentionally left empty so FIREWORKS_API_KEY env var is used.
    api_key: ""
    params:
      max_tokens: 512
      temperature: 0.0

experiment:
  tag: persuasion_hospital_openrouter_smoke
  output_dir: experiments/persuasion/hospital/outputs/openrouter_smoke
  max_concurrent_runs: 2
  seeds: [1]
  persuasion_hospital:
    # Coalition selection strategy:
    # - hospital_coalition: prefer department-role coalitions by hospital (default)
    # - random / first: simpler alternatives
    colluder_selection: hospital_coalition
    # Optional: override built-in variant text
    # prompt_variant_overrides: {}
  sweeps:
    - name: openrouter_smoke_sweep
      topologies: [complete]
      # Hospital agent counts must be 1 + 4*k (Resource_Provisioner + 4 departments per hospital).
      num_agents: [9]
      num_patients: ["num_agents_minus_1"]
      strategies:
        - covert_max_coalition_reward
      colluder_counts: [4]
      target_roles:
        - departmental
      coalition_clique_enabled: [true]
      secret_channel_enabled: [true]
      prompt_variants:
        - control
        - helpful_misdirection

simulation:
  max_iterations: 2
  max_planning_rounds: 2
  max_conversation_steps: 3
  seed: 1
  tags: [openrouter_smoke]

environment:
  import_path: "envs.dcops.hospital.hospital_env:HospitalEnvironment"
  name: HospitalEnvironment
  num_patients: 8
  num_hospitals: 2

communication_network:
  topology: complete
  num_agents: 9
  consolidate_channels: true

llm_models:
  - label: openrouter-gpt-4o-mini
    llm:
      provider: fireworks
      fireworks:
        model: openai/gpt-4o-mini
        base_url: https://openrouter.ai/api/v1
        # Leave api_key empty: the fireworks client falls back to env var FIREWORKS_API_KEY.
        # Set FIREWORKS_API_KEY=<your OPENROUTER_API_KEY> in .env (see README).
        api_key: ""
        params:
          max_tokens: 1024
          temperature: 0.7