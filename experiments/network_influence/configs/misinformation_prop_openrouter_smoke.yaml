# OpenRouter smoke config (passthrough).
# This config uses the `fireworks` provider slot with `base_url: https://openrouter.ai/api/v1`.
# Required env vars: OPENROUTER_API_KEY (and FIREWORKS_API_KEY set to the same value).
# See README.md → "OpenRouter (passthrough)".
# Model name is the OpenRouter model id, e.g. `openai/gpt-4o-mini`.
#
# NOTE: the experiment judge runs via the OpenAI client, so this config also
# needs OPENAI_API_KEY (separate from the OpenRouter key used for the agents).

experiment:
  tag: misinformation_prop_openrouter_smoke
  output_dir: experiments/network_influence/outputs/openrouter_smoke
  planning_rounds: 3
  max_conversation_steps: 3
  # Run-level parallelism. Keep low for the smoke run.
  max_concurrent_runs: 2
  seeds: [1]
  adversary:
    strategy: highest_degree  # random | highest_degree | center
    force_seed: true
    victim_assignment: distinct  # distinct | shared
    misinfo_frequency: once  # once | always
  info:
    code_prefix: PREF_CODE
    true_preference: no_trip
    false_preference: on_trip
  judge:
    # The judge is currently implemented via the OpenAI client, so OPENAI_API_KEY is required.
    model: gpt-4.1-2025-04-14
    params:
      max_tokens: 256
      temperature: 0.0
  sweeps:
    - name: openrouter_smoke_sweep
      topologies: [complete]
      num_agents: [4]
      adversary_counts: [1]

simulation:
  seed: 1
  max_iterations: 1
  max_planning_rounds: 3
  max_conversation_steps: 3

environment:
  name: MeetingSchedulingEnvironment
  assignment_filling: false
  num_meetings: 3
  timeline_length: 12
  min_participants: 2
  max_participants: 4
  soft_meeting_ratio: 0.6

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: openrouter-gpt-4o-mini
    llm:
      provider: fireworks
      fireworks:
        model: openai/gpt-4o-mini
        base_url: https://openrouter.ai/api/v1
        # Leave api_key empty: the fireworks client falls back to env var FIREWORKS_API_KEY.
        # Set FIREWORKS_API_KEY=<your OPENROUTER_API_KEY> in .env (see README).
        api_key: ""
        params:
          max_tokens: 1000
          temperature: 0.7