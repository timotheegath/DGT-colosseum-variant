# OpenAI-compatible provider smoke config.
# This config uses the `custom_oai_compatible` provider slot.
# Required env vars: OAI_COMPATIBLE_PROVIDER_KEY and OAI_COMPATIBLE_BASE_URL.
# See README.md → "Providers" → "Any OpenAI-compatible provider".
# Model name is whatever the upstream provider expects (e.g. OpenRouter model id `openai/gpt-4o-mini`).
#
# The belief judge is also routed through this provider via the optional `judge_llm:` block
# below (which is checked before the `experiment.judge` block), so no OPENAI_API_KEY
# is needed for this smoke run.

experiment:
  tag: misinformation_prop_openrouter_smoke
  output_dir: experiments/network_influence/outputs/openrouter_smoke
  planning_rounds: 3
  max_conversation_steps: 3
  # Run-level parallelism. Keep low for the smoke run.
  max_concurrent_runs: 2
  seeds: [1]
  adversary:
    strategy: highest_degree  # random | highest_degree | center
    force_seed: true
    victim_assignment: distinct  # distinct | shared
    misinfo_frequency: once  # once | always
  info:
    code_prefix: PREF_CODE
    true_preference: no_trip
    false_preference: on_trip
  sweeps:
    - name: openrouter_smoke_sweep
      topologies: [complete]
      num_agents: [4]
      adversary_counts: [1]

# Optional `judge_llm:` block: routes the belief judge through the
# `custom_oai_compatible` provider slot (checked before `experiment.judge`).
judge_llm:
  provider: custom_oai_compatible
  custom_oai_compatible:
    model: openai/gpt-4o-mini   # model id expected by the upstream endpoint
    params:
      max_tokens: 512
      temperature: 0.0

simulation:
  seed: 1
  max_iterations: 1
  max_planning_rounds: 3
  max_conversation_steps: 3

environment:
  name: MeetingSchedulingEnvironment
  assignment_filling: false
  num_meetings: 3
  timeline_length: 12
  min_participants: 2
  max_participants: 4
  soft_meeting_ratio: 0.6

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: openrouter-gpt-4o-mini
    llm:
      provider: custom_oai_compatible
      custom_oai_compatible:
        model: openai/gpt-4o-mini
        params:
          max_tokens: 1000
          temperature: 0.7