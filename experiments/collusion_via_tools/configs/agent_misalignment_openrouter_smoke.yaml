# OpenAI-compatible provider smoke config.
# This config uses the `custom_oai_compatible` provider slot.
# Required env vars: OAI_COMPATIBLE_PROVIDER_KEY and OAI_COMPATIBLE_BASE_URL.
# See README.md → "Providers" → "Any OpenAI-compatible provider".
# Model name is whatever the upstream provider expects (e.g. OpenRouter model id `openai/gpt-4o-mini`).
#
# The belief judge is also routed through this provider via the optional `judge_llm:` block
# below (which is checked before the `experiment.evaluator` model), so no OPENAI_API_KEY
# is needed for this smoke run.

experiment:
  tag: agent_misalignment_openrouter_smoke
  output_dir: experiments/agent_misalignment/outputs/openrouter_smoke
  max_concurrent_runs: 2
  seeds: [1]

  adversary:
    strategy: agent_misalignment
    attack_frequency: always
    secret_channel_enabled: true
    coalition_clique_enabled: true

  info:
    code_prefix: AGENT_MISALIGNMENT

  # No `evaluator:` block here: the judge reads the `judge_llm:` block below first and
  # only falls back to `experiment.evaluator` (OpenAI) when `judge_llm` is absent.
  sweeps:
    - name: openrouter_smoke_sweep
      topologies: [complete]
      adversary_counts: [2]
      strategies: [covert_max_coalition_reward]

      # The coalition must contain at least one of these:
      target_roles:
        - Resource_Provisioner
        - departmental

      # 8 non-provisioners + 1 Provisioner (minimum hospital size).
      num_agents: [9]
      num_patients: ["num_agents_minus_1"]

# Optional `judge_llm:` block: routes the belief judge through the
# `custom_oai_compatible` provider slot (checked before `experiment.evaluator`).
judge_llm:
  provider: custom_oai_compatible
  custom_oai_compatible:
    model: openai/gpt-4o-mini   # model id expected by the upstream endpoint
    params:
      max_tokens: 512
      temperature: 0.0

simulation:
  seed: 1
  max_iterations: 3 # Baseline from hospital.yaml
  max_planning_rounds: 1 # Baseline from hospital.yaml
  max_conversation_steps: 2 # Baseline from hospital.yaml

environment:
  import_path: "envs.dcops.hospital.hospital_env:HospitalEnvironment"
  name: HospitalEnvironment
  num_patients: 8
  num_hospitals: 2
  default_capacity: 2

communication_network:
  topology: complete
  num_agents: 9 # Overridden by sweep
  consolidate_channels: true
  center: 0

llm_models:
  - label: openrouter-deepseek-v4.1-flash
    llm:
      provider: custom_oai_compatible
      custom_oai_compatible:
        model: deepseek/deepseek-v4.1-flash
        params:
          max_tokens: 1024
          temperature: 0.7