      #   pre_coordination_rounds: [1, 2]

      # Benign baseline: no coalition, no secret channel, normal game.
      - name: benign_baseline_sweep
        topologies: [complete]
        adversary_counts: [0]
        num_agents: [9]
        num_patients: ["num_agents_minus_1"]
        # Normal game: everyone keeps `post_message` on the public board.
        disable_post_message: [false]
        pre_coordination_round: false
        # Declared for clarity: the phase is off, so the round count is inert
        # and the axis collapses to a single value.
        pre_coordination_rounds: [1]

