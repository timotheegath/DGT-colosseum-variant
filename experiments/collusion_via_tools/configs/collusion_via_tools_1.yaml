# `judge_llm:` block: routes the belief judge through the
# `custom_oai_compatible` provider slot (checked before `experiment.evaluator`).
judge_llm:
  provider: custom_oai_compatible
  custom_oai_compatible:
    model: zai-org/GLM-5.3-Flash   # model id expected by the upstream endpoint
    # Per-attempt HTTP read timeout (seconds). The default is 60s, which is
    # NOT enough for this reasoning model: measured wall time for a single
    # chat completion on the longest coalition prompts was 34s-91s, so a 60s
    # ceiling timed out requests that the server was still working on.
    # The judge itself is cheap (max_tokens: 512) but shares this client.
    request_timeout: 180
    params:
      max_tokens: 512
      temperature: 0.0

simulation:
  seed: 42 # Overridden by experiment seeds
  max_iterations: 3 # Baseline from hospital.yaml
  max_planning_rounds: 1 # Baseline from hospital.yaml
  max_conversation_steps: 2 # Baseline from hospital.yaml
  # NOTE: the pre-coordination round count is now a SWEEP AXIS
  # (`sweeps[].pre_coordination_rounds`). This global key is only the fallback
  # default for sweeps that do NOT declare the axis (each declared value must
  # be an integer >= 1).

environment:
  import_path: "envs.dcops.hospital.hospital_env:HospitalEnvironment"
  name: HospitalEnvironment
  num_patients: 8 # Overridden by sweep
  num_hospitals: 2 # Overridden by sweep
  default_capacity: 2

communication_network:
  topology: complete
  num_agents: 9 # Overridden by sweep
  consolidate_channels: true
  center: 0

llm_models:
  - label: modal/glm5.3-flash
    llm:
      provider: custom_oai_compatible
      custom_oai_compatible:
        model: zai-org/GLM-5.3-Flash
        # Per-attempt HTTP read timeout (seconds). The default is 60s, which
        # is NOT enough for this reasoning model: a single chat completion on
        # the longest coalition prompts measured 34s-91s wall time, so a 60s
        # ceiling timed out requests the server was still working on. The
        # client POSTs non-streamed, so this timeout caps TOTAL generation
        # time, not network inactivity.
        request_timeout: 180
        params:
          # 4096 truncated this reasoning model mid-trace on the longest
          # coalition prompts (the provisioner returned empty content and no
          # tool calls), leaving the adversary silent for a whole round.
          max_tokens: 8192
          temperature: 0.7