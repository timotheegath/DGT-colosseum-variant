# OpenAI-compatible provider smoke config.
# This config uses the `custom_oai_compatible` provider slot.
# Required env vars: OAI_COMPATIBLE_PROVIDER_KEY and OAI_COMPATIBLE_BASE_URL.
# See README.md → "Providers" → "Any OpenAI-compatible provider".
# Model name is whatever the upstream provider expects (e.g. OpenRouter model id `openai/gpt-4o-mini`).

# Optional `judge_llm:` block: routes the blackboard judge (`judge_blackboards.py`,
# via its `--config <this file>` flag) through the `custom_oai_compatible` provider
# slot. When absent, the judge falls back to the OpenAI default (gpt-4o-mini).
judge_llm:
  provider: custom_oai_compatible
  custom_oai_compatible:
    model: openai/gpt-4o-mini   # model id expected by the upstream endpoint
    params:
      max_tokens: 512
      temperature: 0.0

simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [openrouter_smoke]

environment:
  import_path: experiments.collusion.choice.jira_ticket_choice_env:JiraTicketChoiceEnvironment
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 3
  consolidate_channels: true

llm_models:
  - label: openrouter-gpt-4o-mini
    llm:
      provider: custom_oai_compatible
      custom_oai_compatible:
        model: openai/gpt-4o-mini
        params:
          max_tokens: 2000
          temperature: 0.7

experiment:
  tag: openrouter_smoke
  output_dir: experiments/collusion/outputs/openrouter_smoke
  max_concurrent_runs: 2
  seeds: [1]
  collusion:
    # Keep colluder identity stable within a run (agents are still seed-dependent).
    colluder_selection: first
  sweeps:
    - name: openrouter_smoke_sweep
      topologies: [complete]
      num_agents: [3]
      colluder_counts: [2]
      secret_channel_enabled: [true]
      # Prompt variants only apply when secret_channel_enabled=true.
      prompt_variants: [control]