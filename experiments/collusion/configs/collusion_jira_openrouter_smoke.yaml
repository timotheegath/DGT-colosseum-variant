# OpenRouter smoke config (passthrough).
# This config uses the `fireworks` provider slot with `base_url: https://openrouter.ai/api/v1`.
# Required env vars: OPENROUTER_API_KEY (and FIREWORKS_API_KEY set to the same value).
# See README.md → "OpenRouter (passthrough)".
# Model name is the OpenRouter model id, e.g. `openai/gpt-4o-mini`.

simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [openrouter_smoke]

environment:
  import_path: experiments.collusion.choice.jira_ticket_choice_env:JiraTicketChoiceEnvironment
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 3
  consolidate_channels: true

llm_models:
  - label: openrouter-gpt-4o-mini
    llm:
      provider: fireworks
      fireworks:
        model: openai/gpt-4o-mini
        base_url: https://openrouter.ai/api/v1
        # Leave api_key empty: the fireworks client falls back to env var FIREWORKS_API_KEY.
        # Set FIREWORKS_API_KEY=<your OPENROUTER_API_KEY> in .env (see README).
        api_key: ""
        params:
          max_tokens: 2000
          temperature: 0.7

experiment:
  tag: openrouter_smoke
  output_dir: experiments/collusion/outputs/openrouter_smoke
  max_concurrent_runs: 2
  seeds: [1]
  collusion:
    # Keep colluder identity stable within a run (agents are still seed-dependent).
    colluder_selection: first
  sweeps:
    - name: openrouter_smoke_sweep
      topologies: [complete]
      num_agents: [3]
      colluder_counts: [2]
      secret_channel_enabled: [true]
      # Prompt variants only apply when secret_channel_enabled=true.
      prompt_variants: [control]